name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: openslacktag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image runs
        run: docker run --rm openslacktag:ci help
      - name: Build the sandbox image
        run: docker build -t openslacktag-sandbox sandbox/
      - name: The sandbox has its tools
        run: docker run --rm openslacktag-sandbox python -c "import pandas, openpyxl, docx, pptx, matplotlib; print('ok')"
