name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The release workflow runs these checks on every version tag first.
  workflow_call:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: openslacktag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image runs
        run: docker run --rm openslacktag:ci help
      - name: Build the sandbox image
        run: docker build -t openslacktag-sandbox sandbox/
      - name: The sandbox has its tools
        run: docker run --rm openslacktag-sandbox python -c "import pandas, openpyxl, docx, pptx, matplotlib; print('ok')"
      - name: It writes as the folder's owner and can reach the sandbox
        run: |
          mkdir work && sudo chown 1234:1234 work
          docker run --rm -v "$PWD/work:/srv" -v /var/run/docker.sock:/var/run/docker.sock \
            -e LLM_PROVIDER=openai -e LLM_MODEL=x -e LLM_BASE_URL=http://127.0.0.1:9/v1 \
            -e SANDBOX_IMAGE=openslacktag-sandbox \
            openslacktag:ci doctor | tee doctor.txt || true
          test "$(stat -c %u work/data)" = 1234
          grep -F "[ok]   sandbox" doctor.txt
